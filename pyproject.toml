[project]
name = "weakincentives"
dynamic = ["version"]
description = "WINK: a small, modular spine for building reliable AI agents"
readme = "README.md"
authors = [
    { name = "Andrei Savu", email = "andrei@weakincentives.com" }
]
requires-python = ">=3.12"
dependencies = []
license = { text = "Apache-2.0" }
keywords = [
    "ai",
    "agents",
    "weak-incentives",
    "spine",
    "minimal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://weakincentives.com/"
Repository = "https://github.com/weakincentives/weakincentives"
"Issue Tracker" = "https://github.com/weakincentives/weakincentives/issues"

# The spine is the only required install. Future extras will appear here as
# they are built (each declared with its own pip-installable dependency set):
#
#   [project.optional-dependencies]
#   claude = ["claude-agent-sdk>=0.1.59"]
#   redis  = ["redis>=7.4.0"]
#   ...

[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>.+)"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/weakincentives"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.0.1",
    "ruff>=0.15.10",
    "pyright>=1.1.408",
    "ty>=0.0.31",
    "mdformat>=1.0.0",
    "hypothesis>=6.152.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "C90",
    "ANN",
    "RET",
    "RSE",
    "PTH",
    "ISC",
    "A",
    "RUF",
    "TRY",
    "PLR",
    "PERF",
]
extend-ignore = [
    "TRY003",
    "RUF067",
]
fixable = ["I001", "F401", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["weakincentives"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN201",
    "ANN401",
    "C901",
    "PLR0913",
    "PLR0914",
    "PLR2004",
    "PLR6301",
    "S101",
    "SIM117",
]
"src/weakincentives/core/prompt.py" = ["PLR0913"]
"src/weakincentives/core/transactions.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--cov=src/weakincentives --cov-report=term-missing --cov-fail-under=100 --timeout=10 --timeout-method=thread"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/weakincentives"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "@abstractmethod",
    "^\\s*\\.\\.\\.\\s*$",
    ":\\s*\\.\\.\\.\\s*$",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src"]
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "dist",
]
deprecateTypingAliases = true
reportImplicitOverride = "error"
reportPrivateUsage = "error"
reportUnknownMemberType = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "error"
reportMatchNotExhaustive = "error"

[tool.ty]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
deprecated = "error"
division-by-zero = "error"
invalid-ignore-comment = "error"
redundant-cast = "ignore"
possibly-missing-import = "error"
unused-ignore-comment = "error"
useless-overload-body = "error"
